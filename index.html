<html lang="th">
<head>

tailwind.config = {
  theme:{ extend:{
    fontFamily:{ sans:['Sarabun','ui-sans-serif','system-ui'] },
    colors:{
      brand:{ DEFAULT:'#0C7C82', light:'#35B4B0', 50:'#EAF7F7', 100:'#D3EFEF', 200:'#A7DEDE', 600:'#0C7C82', 700:'#0A666B' },
      mint:'#26A69A', lime:'#AED581', amber:'#FFCA28', coral:'#FF8A65',
      rose:'#EF5350', grape:'#4A2C6D', ruby:'#D32F2F', orange:'#F57C00',
      gold:'#FBC02D', ocean:'#0288D1'
    },
    boxShadow:{ soft:'0 10px 30px -12px rgba(12,124,130,.25)', card:'0 4px 20px -8px rgba(16,24,40,.12)' }

}

<style>
  body{font-family:'Sarabun',sans-serif;background:#F6F9FA;-webkit-tap-highlight-color:transparent}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cfe3e4;border-radius:99px}
  .skel{background:linear-gradient(90deg,#eef2f3 25%,#e2e9ea 37%,#eef2f3 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:.75rem}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .fade-in{animation:fi .35s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .menu-active{background:linear-gradient(135deg,#0C7C82,#35B4B0);color:#fff;box-shadow:0 8px 20px -8px rgba(12,124,130,.6)}
  .glass{backdrop-filter:blur(14px);background:rgba(255,255,255,.88)}
  input[type=color]{-webkit-appearance:none;border:none;width:46px;height:38px;background:none;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:2px solid #fff;border-radius:10px;box-shadow:0 0 0 1px #d8e3e4}
  .inp{width:100%;border:1px solid #e2e8ea;border-radius:.85rem;padding:.6rem .9rem;background:#fff;transition:.2s;font-size:.95rem}
  .inp:focus{outline:none;border-color:#35B4B0;box-shadow:0 0 0 4px rgba(53,180,176,.15)}
  .lbl{font-size:.85rem;font-weight:600;color:#475569;margin-bottom:.3rem;display:block}
  .btn{border-radius:.85rem;padding:.6rem 1.1rem;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:.5rem;font-size:.92rem}
  .btn-p{background:linear-gradient(135deg,#0C7C82,#35B4B0);color:#fff}.btn-p:hover{filter:brightness(1.08)}
  .btn-g{background:#fff;color:#0C7C82;border:1px solid #cfe3e4}.btn-g:hover{background:#EAF7F7}
  .ico-btn{width:34px;height:34px;border-radius:.7rem;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
  .safe-b{padding-bottom:env(safe-area-inset-bottom)}
  .swal2-popup{font-family:'Sarabun',sans-serif!important;border-radius:1.25rem!important}
  table.tb th{font-size:.82rem;font-weight:700;color:#0C7C82;text-transform:none;white-space:nowrap}
  .row-h:hover{background:#F2FAFA}
  .dz-over{border-color:#35B4B0!important;background:#EAF7F7!important}
</style>

<body class="text-slate-700">

<!-- ===================== GLOBAL SPINNER ===================== -->
<div id="spin" class="fixed inset-0 z-[9999] hidden items-center justify-center bg-white/60 backdrop-blur-[2px]">
  <div class="flex flex-col items-center gap-3">
    <div class="w-12 h-12 rounded-full border-4 border-brand-100 border-t-brand animate-spin"></div>
    <p class="text-sm font-semibold text-brand">กำลังดำเนินการ...</p>
  </div>
</div>

<!-- ===================== LOGIN ===================== -->
<div id="loginPage" class="min-h-screen hidden items-center justify-center p-4 md:p-8"
     style="background:radial-gradient(1200px 600px at 10% 10%,#D3EFEF 0%,transparent 55%),radial-gradient(900px 500px at 90% 90%,#EAF7F7 0%,transparent 50%),#F6F9FA">
  <div class="w-full max-w-4xl">
    <div class="bg-white rounded-[2rem] shadow-soft overflow-hidden grid md:grid-cols-2 fade-in border border-white">
      <!-- ซ้าย : แบรนด์ -->
      <div class="p-8 md:p-10 text-white flex flex-col items-center justify-center text-center gap-4"
           style="background:linear-gradient(145deg,#0C7C82 0%,#35B4B0 100%)">
        <div class="w-28 h-28 rounded-3xl bg-white/15 ring-4 ring-white/25 flex items-center justify-center overflow-hidden shadow-lg">
          <img id="loginLogo" class="w-full h-full object-contain p-2" alt="logo">
        </div>
        <h1 class="text-2xl md:text-[26px] font-extrabold leading-snug">ระบบจัดเก็บเอกสารราชการ</h1>
        <div class="h-[3px] w-14 bg-white/50 rounded-full"></div>
        <p id="loginSchool" class="text-lg font-bold"></p>
        <p id="loginDept" class="text-sm text-white/85"></p>
      </div>
      <!-- ขวา : ฟอร์ม -->
      <div class="p-8 md:p-10 flex flex-col justify-center">
        <span class="inline-flex w-fit items-center gap-2 text-xs font-bold bg-brand-50 text-brand px-3 py-1.5 rounded-full mb-4">
          <i class="fa-solid fa-shield-halved"></i> เข้าสู่ระบบ
        </span>
        <h2 class="text-2xl font-extrabold text-slate-800">ยินดีต้อนรับ</h2>
        <p class="text-sm text-slate-400 mb-6">กรุณากรอกชื่อผู้ใช้และรหัสผ่านของท่าน</p>
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="lbl">ชื่อผู้ใช้ (Username)</label>
            <div class="relative">
              <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-brand-light"></i>
              <input id="lgUser" class="inp pl-10" placeholder="username" autocomplete="username">
            </div>
          </div>
          <div>
            <label class="lbl">รหัสผ่าน (Password)</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-brand-light"></i>
              <input id="lgPass" type="password" class="inp pl-10 pr-10" placeholder="••••••" autocomplete="current-password">
              <button type="button" onclick="togglePw()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand">
                <i id="pwEye" class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <button class="btn btn-p w-full justify-center py-3 text-base shadow-soft"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>
        </form>
        <div class="mt-6 text-[12px] text-slate-400 bg-slate-50 rounded-xl p-3 leading-relaxed">
          <b class="text-slate-500">บัญชีทดลอง :</b> admin / 1234 &nbsp;•&nbsp; teacher / 1234
        </div>
      </div>
    </div>
    <p id="loginFooter" class="text-center text-xs text-slate-400 mt-5"></p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="appPage" class="hidden">
  <!-- overlay -->
  <div id="ovl" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden" onclick="toggleSidebar(false)"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed z-50 top-0 left-0 h-full w-[272px] bg-white border-r border-slate-100 flex flex-col
         -translate-x-full md:translate-x-0 transition-transform duration-300">
    <div class="p-5 text-white" style="background:linear-gradient(145deg,#0C7C82,#35B4B0)">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-white/20 ring-2 ring-white/30 overflow-hidden flex items-center justify-center shrink-0">
          <img id="sbLogo" class="w-full h-full object-contain p-1">
        </div>
        <div class="min-w-0">
          <p class="font-extrabold leading-tight text-[15px]">ระบบจัดเก็บเอกสารราชการ</p>
          <p id="sbSchool" class="text-[11px] text-white/80 truncate"></p>
        </div>
        <button class="md:hidden ml-auto w-8 h-8 rounded-lg bg-white/15" onclick="toggleSidebar(false)"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <nav id="navMenu" class="flex-1 overflow-y-auto p-3 space-y-1.5"></nav>
    <div class="p-3 border-t border-slate-100">
      <div class="flex items-center gap-3 p-2.5 rounded-2xl bg-brand-50/70">
        <div id="sbAvatar" class="w-10 h-10 rounded-full text-white font-bold flex items-center justify-center shrink-0" style="background:linear-gradient(135deg,#0C7C82,#35B4B0)"></div>
        <div class="min-w-0 flex-1">
          <p id="sbName" class="text-sm font-bold text-slate-700 truncate"></p>
          <p id="sbRole" class="text-[11px] text-brand font-semibold"></p>
        </div>
        <button onclick="doLogout()" class="ico-btn bg-white text-rose hover:bg-rose hover:text-white" title="ออกจากระบบ"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="md:ml-[272px] min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 glass border-b border-slate-100">
      <div class="px-4 md:px-7 h-16 flex items-center gap-3">
        <button class="md:hidden ico-btn bg-brand-50 text-brand" onclick="toggleSidebar(true)"><i class="fa-solid fa-bars-staggered"></i></button>
        <div class="min-w-0">
          <h2 id="pgTitle" class="font-extrabold text-slate-800 text-[17px] leading-tight truncate"></h2>
          <p id="pgSub" class="text-[11px] text-slate-400 truncate"></p>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <span id="topBadge" class="hidden sm:inline-flex items-center gap-2 text-[12px] font-bold bg-brand-50 text-brand px-3 py-1.5 rounded-full"></span>
          <button onclick="doLogout()" class="ico-btn bg-rose/10 text-rose hover:bg-rose hover:text-white"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </header>

    <main id="pageContent" class="flex-1 p-4 md:p-7 pb-32 md:pb-7"></main>

    <footer class="border-t border-slate-100 bg-white px-4 md:px-7 py-5 mb-20 md:mb-0">
      <p class="text-center text-[12.5px] text-slate-500">
        <i class="fa-solid fa-folder-open text-brand-light mr-1"></i>
        <b class="text-brand">ระบบจัดเก็บเอกสารราชการ</b> — <span id="ftSchool"></span>
      </p>
    </footer>
  </div>

  <!-- MOBILE BOTTOM NAV -->
  <div id="bottomNav" class="md:hidden fixed bottom-3 left-3 right-3 z-40 safe-b">
    <div class="glass rounded-[26px] shadow-[0_14px_40px_-12px_rgba(12,124,130,.45)] border border-white/70 px-2 py-2 flex justify-around items-center"></div>
  </div>
</div>

<!-- MODAL ROOT -->
<div id="modalRoot"></div>

<script>
/* ============================================================
   DATA LAYER
============================================================ */
const K={s:'dms_settings',u:'dms_users',y:'dms_years',t:'dms_types',d:'dms_docs',a:'dms_auth'};
const store={
  get(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?f:v}catch(e){return f}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const PALETTE=['#0C7C82','#35B4B0','#26A69A','#AED581','#FFCA28','#FF8A65','#EF5350','#4A2C6D','#D32F2F','#F57C00','#FBC02D','#0288D1'];
const DEF_LOGO='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#fff"/><path d="M60 22 78 40H42z" fill="#0C7C82"/><rect x="34" y="46" width="52" height="42" rx="8" fill="#35B4B0"/><rect x="44" y="58" width="32" height="6" rx="3" fill="#fff"/><rect x="44" y="70" width="22" height="6" rx="3" fill="#fff"/></svg>`);

function seed(){
  if(!localStorage.getItem(K.s)) store.set(K.s,{schoolName:'โรงเรียนบ้านตัวอย่างวิทยา',dept:'สำนักงานเขตพื้นที่การศึกษาประถมศึกษา เขต 1',logo:DEF_LOGO});
  if(!localStorage.getItem(K.u)) store.set(K.u,[
    {id:uid(),username:'admin',password:'1234',fullname:'นายผู้ดูแล ระบบงาน',role:'admin'},
    {id:uid(),username:'teacher',password:'1234',fullname:'นางสาวครูสมศรี ใจดี',role:'teacher'},
    {id:uid(),username:'teacher2',password:'1234',fullname:'นายครูสมชาย รักเรียน',role:'teacher'}
  ]);
  if(!localStorage.getItem(K.y)) store.set(K.y,[
    {id:uid(),year:'2566',color:'#4A2C6D'},{id:uid(),year:'2567',color:'#0288D1'},{id:uid(),year:'2568',color:'#0C7C82'}
  ]);
  if(!localStorage.getItem(K.t)) store.set(K.t,[
    {id:uid(),name:'หนังสือภายนอก',color:'#0C7C82'},{id:uid(),name:'หนังสือภายใน',color:'#35B4B0'},
    {id:uid(),name:'คำสั่ง',color:'#FF8A65'},{id:uid(),name:'ประกาศ',color:'#FFCA28'},
    {id:uid(),name:'ระเบียบ/ข้อบังคับ',color:'#0288D1'},{id:uid(),name:'บันทึกข้อความ',color:'#AED581'}
  ]);
  if(!localStorage.getItem(K.d)){
    const T=store.get(K.t,[]),Y=store.get(K.y,[]),U=store.get(K.u,[]);
    const sub=['ขอความอนุเคราะห์วิทยากร','แต่งตั้งคณะกรรมการดำเนินงาน','ประกาศรับสมัครนักเรียน','รายงานผลการดำเนินงานประจำปี','เชิญประชุมผู้บริหารสถานศึกษา','ขออนุมัติจัดซื้อจัดจ้าง','แนวปฏิบัติการจัดการเรียนการสอน','ขออนุญาตไปราชการ','การจัดสรรงบประมาณประจำปี','รายงานการประเมินตนเอง (SAR)','ขอเชิญเข้าร่วมอบรมเชิงปฏิบัติการ','มาตรการความปลอดภัยในสถานศึกษา'];
    const ag=['สพฐ.','สพป. เขต 1','ศธจ.','เทศบาลตำบล','มหาวิทยาลัยราชภัฏ','สำนักงานสาธารณสุขอำเภอ'];
    const docs=sub.map((s,i)=>({
      id:uid(), docNo:`ศธ 04${(100+i)}/${(2500+i*7)}`, subject:s,
      typeId:T[i%T.length].id, agency:ag[i%ag.length],
      docDate:`202${4+(i%2)}-${String((i%12)+1).padStart(2,'0')}-${String((i%27)+1).padStart(2,'0')}`,
      yearId:Y[i%Y.length].id, responsible:U[(i%2)+1].fullname, ownerId:U[(i%2)+1].id,
      files:[], createdAt:Date.now()-i*86400000
    }));
    store.set(K.d,docs);
  }
}
const DB={
  settings:()=>store.get(K.s,{}), saveSettings:v=>store.set(K.s,v),
  users:()=>store.get(K.u,[]),   saveUsers:v=>store.set(K.u,v),
  years:()=>store.get(K.y,[]),   saveYears:v=>store.set(K.y,v),
  types:()=>store.get(K.t,[]),   saveTypes:v=>store.set(K.t,v),
  docs:()=>store.get(K.d,[]),    saveDocs:v=>store.set(K.d,v)
};

/* ============================================================
   HELPERS
============================================================ */
const $=s=>document.querySelector(s), $=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const showLoad=()=>{$('#spin').classList.remove('hidden');$('#spin').classList.add('flex')};
const hideLoad=()=>{$('#spin').classList.add('hidden');$('#spin').classList.remove('flex')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const toast=(icon,title)=>Swal.fire({toast:true,position:'top-end',icon,title,showConfirmButton:false,timer:2200,timerProgressBar:true});
const thDate=d=>{ if(!d) return '-'; const x=new Date(d); if(isNaN(x)) return esc(d);
  const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${x.getDate()} ${m[x.getMonth()]} ${x.getFullYear()+543}`};
const typeById=id=>DB.types().find(t=>t.id===id);
const yearById=id=>DB.years().find(y=>y.id===id);
const hex2rgba=(h,a)=>{const c=h.replace('#','');return `rgba(${parseInt(c.substr(0,2),16)},${parseInt(c.substr(2,2),16)},${parseInt(c.substr(4,2),16)},${a})`};
const badge=(text,color)=>`<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11.5px] font-bold" style="background:${hex2rgba(color,.13)};color:${color}"><span class="w-1.5 h-1.5 rounded-full" style="background:${color}"></span>${esc(text)}</span>`;
const fileSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const skel=(n=4)=>`<div class="space-y-3">${Array.from({length:n}).map(()=>`<div class="skel h-20 w-full"></div>`).join('')}</div>`;

/* ============================================================
   AUTH
============================================================ */
let ME=null;
function togglePw(){const i=$('#lgPass');i.type=i.type==='password'?'text':'password';$('#pwEye').className=i.type==='password'?'fa-solid fa-eye':'fa-solid fa-eye-slash'}

function showLogin(){
  const s=DB.settings();
  $('#loginLogo').src=s.logo||DEF_LOGO;
  $('#loginSchool').textContent=s.schoolName||'-';
  $('#loginDept').textContent=s.dept||'-';
  $('#loginFooter').textContent=`ระบบจัดเก็บเอกสารราชการ — ${s.schoolName||''}`;
  $('#appPage').classList.add('hidden');
  $('#loginPage').classList.remove('hidden');$('#loginPage').classList.add('flex');
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const u=$('#lgUser').value.trim(), p=$('#lgPass').value;
  if(!u||!p) return Swal.fire({icon:'warning',title:'ข้อมูลไม่ครบ',text:'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน',confirmButtonColor:'#0C7C82'});
  showLoad(); await sleep(650); hideLoad();
  const found=DB.users().find(x=>x.username===u&&x.password===p);
  if(!found) return Swal.fire({icon:'error',title:'เข้าสู่ระบบไม่สำเร็จ',text:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',confirmButtonColor:'#0C7C82'});
  store.set(K.a,found.id); ME=found;
  toast('success',`ยินดีต้อนรับ ${found.fullname}`);
  enterApp();
});
function doLogout(){
  Swal.fire({title:'ออกจากระบบ?',text:'ต้องการออกจากระบบใช่หรือไม่',icon:'question',showCancelButton:true,
    confirmButtonText:'ออกจากระบบ',cancelButtonText:'ยกเลิก',confirmButtonColor:'#EF5350',cancelButtonColor:'#94a3b8',reverseButtons:true})
  .then(async r=>{ if(r.isConfirmed){ showLoad(); await sleep(500); hideLoad(); localStorage.removeItem(K.a); ME=null;
    $('#lgUser').value='';$('#lgPass').value=''; showLogin(); toast('success','ออกจากระบบแล้ว'); }});
}

/* ============================================================
   SHELL / MENU
============================================================ */
const MENUS={
  admin:[
    {k:'dash',  t:'แดชบอร์ด',        i:'fa-chart-pie',        c:'#0C7C82', sub:'ภาพรวมระบบจัดเก็บเอกสาร'},
    {k:'docs',  t:'จัดการเอกสาร',     i:'fa-folder-open',      c:'#35B4B0', sub:'เพิ่ม แก้ไข ลบ ค้นหาเอกสาร'},
    {k:'types', t:'ประเภทเอกสาร',     i:'fa-tags',             c:'#FF8A65', sub:'กำหนดประเภทและสีประจำประเภท'},
    {k:'years', t:'ปีงบประมาณ',       i:'fa-calendar-days',    c:'#0288D1', sub:'กำหนดปีงบประมาณและสี'},

function docFiltered(){
  let r=DB.docs();
  if(DS.q){const q=DS.q.toLowerCase();
    r=r.filter(d=>[d.docNo,d.subject,d.agency,d.responsible].some(v=>String(v||'').toLowerCase().includes(q)));}
  if(DS.type) r=r.filter(d=>d.typeId===DS.type);
  if(DS.year) r=r.filter(d=>d.yearId===DS.year);
  const {k,d:dir}=DS.sort;
  r.sort((a,b)=>{
    let x,y;
    if(k==='type'){x=typeById(a.typeId)?.name||'';y=typeById(b.typeId)?.name||''}
    else if(k==='year'){x=yearById(a.yearId)?.year||'';y=yearById(b.yearId)?.year||''}
    else {x=a[k]||'';y=b[k]||''}
    return (x>y?1:x<y?-1:0)*(dir==='asc'?1:-1);
  });
  return r;
}

function pager(tot,pages){
  const btn=(p,l,dis,act)=>`<button ${dis?'disabled':`onclick="gotoPage(${p})"`} class="min-w-[36px] h-9 px-3 rounded-xl text-[13px] font-bold transition ${act?'text-white shadow-soft':dis?'text-slate-300 bg-slate-50':'text-slate-500 bg-white border border-slate-100 hover:bg-brand-50'}" ${act?'style="background:linear-gradient(135deg,#0C7C82,#35B4B0)"':''}>${l}</button>`;
  let nums='';const s=Math.max(1,DS.page-2),e=Math.min(pages,s+4);
  for(let i=s;i<=e;i++) nums+=btn(i,i,false,i===DS.page);
  return `<div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3.5 border-t border-slate-50">
    <p class="text-[12.5px] text-slate-400">แสดง <b class="text-slate-600">${tot?((DS.page-1)*DS.per+1):0}-${Math.min(DS.page*DS.per,tot)}</b> จาก <b class="text-brand">${tot}</b> รายการ</p>
    <div class="flex items-center gap-1.5">
      ${btn(DS.page-1,'<i class="fa-solid fa-chevron-left text-[11px]"></i>',DS.page<=1)}${nums}${btn(DS.page+1,'<i class="fa-solid fa-chevron-right text-[11px]"></i>',DS.page>=pages)}
      <select onchange="DS.per=+this.value;DS.page=1;paintDocs()" class="inp w-auto py-1.5 text-[12.5px] ml-1">
        ${[5,10,20,50].map(n=>`<option value="${n}" ${DS.per===n?'selected':''}>${n}/หน้า</option>`).join('')}
      </select>
    </div></div>`;
}
function gotoPage(p){DS.page=p;paintDocs()}

          <i class="fa-solid fa-cloud-arrow-up text-3xl text-brand-light mb-2"></i>
          <p class="text-[13.5px] font-bold text-slate-600">คลิกเพื่อเลือกไฟล์ หรือลากไฟล์มาวางที่นี่</p>
          <p class="text-[11.5px] text-slate-400">รองรับ PDF, Word, Excel, รูปภาพ</p>
          <input id="f_file" type="file" multiple class="hidden">
        </div>
        <div id="prev" class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-3"></div>
      </div>
      <p class="text-[11.5px] text-slate-400"><i class="fa-solid fa-circle-info mr-1 text-brand-light"></i>ทุกช่องไม่บังคับกรอก</p>
    </form>`,
    `<button onclick="closeModal()" class="btn btn-g">ยกเลิก</button>
     <button onclick="docSave('${id||''}')" class="btn btn-p"><i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล</button>`,
    id?'fa-pen-to-square':'fa-file-circle-plus','#0C7C82','max-w-3xl');

  const dz=$('#dz'),fi=$('#f_file');
  dz.onclick=()=>fi.click();
  ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('dz-over')}));
  ['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('dz-over')}));
  dz.addEventListener('drop',ev=>addFiles(ev.dataTransfer.files));
  fi.onchange=e=>addFiles(e.target.files);
  paintPrev();
}
function addFiles(list){
  [...list].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{TMP_FILES.push({name:f.name,type:f.type,size:f.size,data:r.result});paintPrev()};
    r.readAsDataURL(f);
  });
}
function rmFile(i){TMP_FILES.splice(i,1);paintPrev()}
function fIcon(t){return t?.startsWith('image')?'fa-file-image':t?.includes('pdf')?'fa-file-pdf':t?.includes('sheet')||t?.includes('excel')?'fa-file-excel':t?.includes('word')?'fa-file-word':'fa-file'}
function paintPrev(){
  const p=$('#prev'); if(!p)return;
  p.innerHTML=TMP_FILES.map((f,i)=>`
    <div class="relative rounded-2xl border border-slate-100 bg-white p-2 flex items-center gap-2 overflow-hidden">
      ${f.type?.startsWith('image')?`<img src="${f.data}" class="w-11 h-11 rounded-xl object-cover shrink-0">`
        :`<span class="w-11 h-11 rounded-xl bg-brand-50 text-brand flex items-center justify-center shrink-0"><i class="fa-solid ${fIcon(f.type)}"></i></span>`}
      <div class="min-w-0"><p class="text-[11.5px] font-bold text-slate-600 truncate">${esc(f.name)}</p><p class="text-[10.5px] text-slate-400">${fileSize(f.size)}</p></div>
      <button type="button" onclick="rmFile(${i})" class="absolute top-1 right-1 w-5 h-5 rounded-full bg-rose text-white text-[10px]"><i class="fa-solid fa-xmark"></i></button>
    </div>`).join('');
}
async function docSave(id){
  showLoad(); await sleep(600);
  const docs=DB.docs();
  const obj={docNo:$('#f_no').value.trim(),subject:$('#f_sub').value.trim(),typeId:$('#f_type').value,
    agency:$('#f_ag').value.trim(),docDate:$('#f_date').value,yearId:$('#f_year').value,
    responsible:$('#f_res').value.trim(),files:TMP_FILES};
  if(id){const i=docs.findIndex(x=>x.id===id);docs[i]={...docs[i],...obj}}
  else docs.unshift({id:uid(),...obj,ownerId:ME.id,createdAt:Date.now()});
  DB.saveDocs(docs); hideLoad(); closeModal(); toast('success',id?'แก้ไขเอกสารเรียบร้อย':'เพิ่มเอกสารเรียบร้อย'); paintDocs();
}
function docDel(id){
  const d=DB.docs().find(x=>x.id===id);

}

  openModal(id?'แก้ไขปีงบประมาณ':'เพิ่มปีงบประมาณ',`
    <div class="space-y-4">
      <div><label class="lbl">ปีงบประมาณ</label><input id="y_year" class="inp" value="${esc(y?.year||'')}" placeholder="เช่น 2568"></div>

        </div></div>
    </div>`,
    `<button onclick="closeModal()" class="btn btn-g">ยกเลิก</button>
     <button onclick="yearSave('${id||''}')" class="btn btn-p"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>`,

async function yearSave(id){
  const year=$('#y_year').value.trim();
  if(!year) return toast('warning','กรุณากรอกปีงบประมาณ');
  showLoad(); await sleep(500);
  const Y=DB.years(),color=$('#y_color').value;
  if(id){const i=Y.findIndex(x=>x.id===id);Y[i]={...Y[i],year,color}} else Y.push({id:uid(),year,color});
  DB.saveYears(Y); hideLoad(); closeModal(); toast('success','บันทึกข้อมูลเรียบร้อย'); viewYears();
}
function yearDel(id){
  const used=DB.docs().filter(d=>d.yearId===id).length;
  confirmDelete(used?`มีเอกสาร ${used} รายการใช้ปีงบประมาณนี้อยู่`:'ต้องการลบปีงบประมาณนี้ใช่หรือไม่')
  .then(async r=>{ if(!r.isConfirmed)return; showLoad(); await sleep(450);
    DB.saveYears(DB.years().filter(x=>x.id!==id)); hideLoad(); toast('success','ลบข้อมูลเรียบร้อย'); viewYears(); });
}

async function userSave(id){

/* ----- Excel (UTF-8 Thai) ----- */
const XH=['username','password','ชื่อ-นามสกุล','บทบาท'];
function xlsxTemplate(){
  const ws=XLSX.utils.aoa_to_sheet([XH,['somchai','123456','นายสมชาย ใจดี','ครู'],['admin2','123456','นางสาวสมหญิง เก่งงาน','ผู้ดูแลระบบ']]);
  ws['!cols']=[{wch:18},{wch:14},{wch:30},{wch:16}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Template');
  XLSX.writeFile(wb,'template_users.xlsx',{bookType:'xlsx',type:'binary'}); toast('success','ดาวน์โหลด Template แล้ว');
}
function xlsxExport(){
  const data=[XH,...DB.users().map(u=>[u.username,u.password,u.fullname,u.role==='admin'?'ผู้ดูแลระบบ':'ครู'])];
  const ws=XLSX.utils.aoa_to_sheet(data); ws['!cols']=[{wch:18},{wch:14},{wch:30},{wch:16}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'ผู้ใช้งาน');
  XLSX.writeFile(wb,`users_${new Date().toISOString().slice(0,10)}.xlsx`); toast('success','ส่งออกไฟล์ Excel แล้ว');
}
function xlsxImport(el){
  const f=el.files[0]; if(!f)return; showLoad();
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const U=DB.users(); let add=0,upd=0;
      rows.forEach(r=>{
        const username=String(r.username||r.Username||'').trim(); if(!username)return;
        const password=String(r.password||r.Password||'123456').trim();
        const fullname=String(r['ชื่อ-นามสกุล']||r.fullname||'').trim();
        const roleTxt=String(r['บทบาท']||r.role||'ครู').trim();
        const role=/admin|ผู้ดูแล/i.test(roleTxt)?'admin':'teacher';
        const i=U.findIndex(x=>x.username===username);
        if(i>-1){U[i]={...U[i],password,fullname:fullname||U[i].fullname,role};upd++} else {U.push({id:uid(),username,password,fullname,role});add++}
      });
      DB.saveUsers(U); hideLoad(); el.value='';
      Swal.fire({icon:'success',title:'นำเข้าข้อมูลสำเร็จ',html:`เพิ่มใหม่ <b>${add}</b> รายการ • อัปเดต <b>${upd}</b> รายการ`,confirmButtonColor:'#0C7C82'});
      viewUsers();
    }catch(err){hideLoad();Swal.fire({icon:'error',title:'นำเข้าไม่สำเร็จ',text:'รูปแบบไฟล์ไม่ถูกต้อง',confirmButtonColor:'#0C7C82'})}
  };
  r.readAsArrayBuffer(f);
}

    </div>

      <div class="flex items-center gap-2 mb-4"><span class="w-1.5 h-5 rounded-full bg-brand-light"></span><h3 class="font-extrabold text-slate-800">ตัวอย่าง (Preview)</h3></div>

        <div class="w-24 h-24 mx-auto rounded-3xl bg-white/15 ring-4 ring-white/25 overflow-hidden flex items-center justify-center mb-3">
          <img id="pvLogo" src="${s.logo||DEF_LOGO}" class="w-full h-full object-contain p-1.5">
        </div>

  </div>`;
  const dz=$('#ldz'),fi=$('#s_logo');

function readLogo(f){ if(!f||!f.type.startsWith('image'))return; const r=new FileReader(); r.onload=()=>{TMP_LOGO=r.result;$('#pvLogo').src=r.result}; r.readAsDataURL(f); }
async function saveSetting(){
